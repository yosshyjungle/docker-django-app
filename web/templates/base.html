{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}掲示板アプリ{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="bg-success">
        <div class="container">
            <div class="pt-3 pb-1 mb-2 text-white d-flex justify-content-between align-items-center flex-wrap">
                <h1>掲示板アプリ</h1>
                {% if user.is_authenticated %}
                    <div>
                        <p class="text-light">ようこそ、{{ user.username }}さん</p>
                    </div>
                    <div>
                        <form action="{% url 'logout_view' %}" method="post" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-light">ログアウト</button>
                        </form>
                    </div>     
                {% else %}
                    <div>
                        <a href="{% url 'signup' %}" class="btn btn-outline-light">サインアップ</a>
                        <a href="{% url 'login' %}" class="btn btn-outline-light">ログイン</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="mb-2">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
    <footer class="bg-secondary">
        <div class="container">
            <div class="pt-3 pb-1 mb-2 text-white">
                <p class="text-center">Copyright &copy; 2025 Django掲示板アプリ</p>
            </div>
        </div>
    </footer>
</body>
</html>
