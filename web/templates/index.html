{% extends "base.html" %}

{% block title %}みんなの投稿一覧{% endblock %}

{% block content %}
<section>
    <h1>みんなの投稿一覧</h1>
    <form action="{% url 'search' %}" method="get" class="d-flex flex-row mb-3">
        <div class="col-md-3">
            <input type="text" name="query" id="id_query" class="form-control" placeholder="検索">
        </div>
        <div class="col-md-2">
            <select name="search_type" class="form-select">
                <option value="partial">部分一致</option>
                <option value="prefix">前方一致</option>
                <option value="suffix">後方一致</option>
            </select>
        </div>
        <div class="col-md-1">
            <button type="submit" class="btn btn-loght">検索</button>
        </div>
    </form>
    <table class="table">
        <colgroup
            <col style="width: 10%;">
            <col style="width: 30%;">
            <col style="width: 20%;">
            <col style="width: 20%;">
        </colgroup>
        <thead>
            <tr>
                <th scope="col" >掲示板ID</th>
                <th scope="col">タイトル</th>
                <th scope="col">作成日時</th>
                <th scope="col">更新日時</th>
            </tr>
        </thead>
        <tbody>
        {% for board in boards %}
            <tr>
                <td scope="col">{{ board.id }}</td>
                <td scope="col"><a href="{% url 'show' pk=board.id %}">{{ board.title }}</a></td>
                <td scope="col">{{ board.created_at }}</td>
                <td scope="col">{{ board.updated_at }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'new' %}" class="btn btn-primary">新規投稿</a>
    <a href="{% url 'my_boards' %}" class="btn btn-primary">自分の投稿一覧</a>
</section>    
{% endblock %}
